<!-- public/auth.html -->
<!DOCTYPE html>
<html lang="en-us">
<head>
  <title>Authentication</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script type="module">
    window.addEventListener('load', (event) => {
      console.debug('Page loaded with URL:', {
        href: window.location.href,
        search: window.location.search,
        referrer: document.referrer,
        hasAuthInProgress: !!sessionStorage.getItem('authInProgress')
      })
    })
    Office.onReady().then(async () => {
      console.debug('Office.js is ready')
      const { initializeApp } = await import('https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js')
      const { 
        getAuth, 
        signInWithRedirect,
        signInWithPopup,
        getRedirectResult,
        GoogleAuthProvider,
        onAuthStateChanged,
        setPersistence,
        browserLocalPersistence
      } = await import('https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js')

      // Initialize Firebase
      const firebaseConfig = {
        apiKey: "AIzaSyCJA5CuyZIl0txUH9tA0XAngcej9kju2gI",
        authDomain: "flourish-financial-care.firebaseapp.com",
        projectId: "flourish-financial-care",
        storageBucket: "flourish-financial-care.firebasestorage.app",
        messagingSenderId: "274986080130",
        appId: "1:274986080130:web:43d88fe4fbe3216747219b"
      }

      const initializeFirebase = async () => {
        try {
          console.debug('Starting Firebase initialization')
          const app = initializeApp(firebaseConfig)
          console.debug('Firebase core initialized')
          
          const auth = getAuth(app)
          console.debug('Firebase auth initialized')
          
          // Enable Firebase persistence
          await setPersistence(auth, browserLocalPersistence)
          console.debug('Firebase persistence enabled')
          
          return { app, auth }
        } catch (error) {
          console.error('Firebase initialization error:', error)
          throw error
        }
      }

      const { app, auth } = await initializeFirebase()
      const provider = new GoogleAuthProvider()
      provider.addScope('profile')
      provider.addScope('email')
      
      // Always force account selection and set proper redirect
      provider.setCustomParameters({
        prompt: 'select_account',
        hd: undefined // Remove domain restriction to allow all Google accounts
      })

      // Check if this is external browser mode (has redirect parameter or no opener)
      const urlParams = new URLSearchParams(window.location.search)
      const redirectUrl = urlParams.get('redirect')
      const isExternalBrowser = !!redirectUrl || (!window.opener && !Office?.context?.ui)
      
      // Function for sending messages back to main app window or handling redirect
      const sendMessageToParent = (message) => {
        if (isExternalBrowser) {
          // External browser - handle authentication completion directly
          if (message.type === 'authComplete') {
            console.log('Auth complete in external browser, storing token and redirecting')
            
            // Store the auth token directly (same format as authStore)
            const authData = {
              user: message.user,
              idToken: message.idToken,
              timestamp: Date.now()
            }
            localStorage.setItem('ohlaw_auth_token', JSON.stringify(authData))
            
            // Determine where to redirect
            if (redirectUrl) {
              // Explicit redirect URL provided
              console.log('Redirecting back to:', redirectUrl)
              window.location.href = redirectUrl
            } else {
              // No explicit redirect, try to go back to referrer or show success
              if (document.referrer && document.referrer !== window.location.href) {
                console.log('Redirecting back to referrer:', document.referrer)
                window.location.href = document.referrer
              } else {
                // Show success message and let user close/navigate
                document.body.innerHTML = `
                  <div style="text-align: center; padding: 2rem; font-family: system-ui;">
                    <h2>✅ Authentication Successful</h2>
                    <p>You can now close this window and return to the application.</p>
                    <button onclick="window.close()" style="padding: 12px 24px; font-size: 16px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 1rem;">Close Window</button>
                  </div>
                `
              }
            }
            return
          } else if (message.type === 'authError') {
            console.error('Auth error in external browser:', message.error)
            // Show error to user
            document.body.innerHTML = `
              <div style="text-align: center; padding: 2rem; font-family: system-ui;">
                <h2>Authentication Error</h2>
                <p>${message.error.message || 'Authentication failed'}</p>
                <button onclick="window.close()" style="padding: 12px 24px; font-size: 16px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer;">Close</button>
              </div>
            `
            return
          }
        } else if (Office?.context?.ui?.messageParent) {
            // Office Add-in dialog
            Office.context.ui.messageParent(JSON.stringify(message))
        } else if (window.opener && !window.opener.closed) {
            // Browser popup window
            window.opener.postMessage(message, window.location.origin)
            window.close()
        } else {
            console.error('No way to communicate with parent window')
        }
      }

      // Check if we're returning from a redirect
      const checkRedirectResult = async () => {
        try {
          const params = new URLSearchParams(window.location.search)
          const expectedState = params.get('state')
          
          console.debug('Checking redirect with full context:', {
            url: window.location.href,
            referer: document.referrer,
            state: expectedState,
            error: params.get('error'),
            authInProgress: sessionStorage.getItem('authInProgress'),
            hasCode: params.has('code'),
            hasToken: window.location.hash.includes('access_token')
          })

          const result = await getRedirectResult(auth)
          console.debug('getRedirectResult result:', {
            hasResult: !!result,
            hasUser: !!result?.user,
            operationType: result?.operationType,
            credential: result?.credential ? 'present' : 'absent'
          })

          // Also check current user in case we missed the redirect result
          const currentUser = auth.currentUser
          console.debug('Current user:', currentUser)

          if (result?.user || currentUser) {
            const user = result?.user || currentUser
            
            // Get Firebase ID token for server validation
            const idToken = await user.getIdToken()
            
            console.log('Auth succeeded, attempting to message parent')
            sendMessageToParent({
              type: 'authComplete',
              user: {
                uid: user.uid,
                email: user.email,
                displayName: user.displayName
              },
              idToken: idToken,
              state: expectedState
            })
          } else {
            // Only treat this as an error if we were expecting a result
            if (sessionStorage.getItem('authInProgress')) {
              console.error('Auth failed, attempting to message parent')
              sendMessageToParent({
                type: 'authError',
                error: {
                  message: 'No auth result after redirect'
                },
                state: expectedState
              })
            } else {
              console.log('No auth result but none expected')
              // Show sign-in button
              const loadingEl = document.getElementById('loading')
              const buttonEl = document.getElementById('signInButton')
              loadingEl.style.display = 'none'
              buttonEl.style.display = 'block'
            }
          }
        } catch (error) {
          console.error('Redirect result error: ', {
            code: error.code,
            message: error.message,
            stack: error.stack
          })
          sendMessageToParent({
            type: 'authError',
            error: {
              code: error.code,
              message: error.message
            },
            state: new URLSearchParams(window.location.search).get('state')
          })
        }
      }

      const initializePage = () => {
        const loadingEl = document.getElementById('loading')
        const buttonEl = document.getElementById('signInButton')
        
        if (sessionStorage.getItem('authInProgress')) {
          buttonEl.style.display = 'none'
          loadingEl.style.display = 'block'
          checkRedirectResult()
        } else {
          loadingEl.style.display = 'none'
          buttonEl.style.display = 'block'
          buttonEl.addEventListener('click', handleGoogleSignIn)
        }
      }

      // Start sign in flow
      const handleGoogleSignIn = async () => {
        try {
          console.info('Initiating signInWithGoogle')
          sessionStorage.setItem('authInProgress', 'true')
          
          // Store the current URL before redirect
          sessionStorage.setItem('redirectUrl', window.location.href)
          
          // Ensure account selection is forced for this sign-in
          provider.setCustomParameters({
            prompt: 'select_account'
          })

          console.debug('Starting redirect with params:', {
            currentUrl: window.location.href,
            authDomain: auth.config.authDomain,
            providerId: provider.providerId
          })

          await signInWithRedirect(auth, provider)
          // await signInWithPopup(auth, provider)
          console.debug('Redirect initiated')
        } catch (error) {
          console.error('Failed to signIn with Google:', {
            code: error.code,
            message: error.message,
            stack: error.stack
          })
          sessionStorage.removeItem('authInProgress')
          sendMessageToParent({
            type: 'authError',
            error: {
              code: error.code,
              message: error.message
            }
          })
        }
      }

      onAuthStateChanged(auth, async (user) => {
        console.debug('Auth state changed: ', user?.email || 'no user')
        
        // Handle both new authentication and restored sessions
        if (user) {
          const isNewAuth = sessionStorage.getItem('authInProgress')
          const expectedState = new URLSearchParams(window.location.search).get('state')
          
          console.debug('User signed in:', { 
            isNewAuth: !!isNewAuth, 
            email: user.email,
            hasState: !!expectedState
          })
          
          try {
            // Get Firebase ID token for server validation
            const idToken = await user.getIdToken()
            
            sendMessageToParent({
              type: 'authComplete',
              user: {
                uid: user.uid,
                email: user.email,
                displayName: user.displayName
              },
              idToken: idToken,
              state: expectedState
            })
            
            if (isNewAuth) {
              sessionStorage.removeItem('authInProgress')
            }
          } catch (error) {
            console.error('Failed to get ID token:', error)
            sendMessageToParent({
              type: 'authError',
              error: {
                message: 'Failed to get authentication token'
              },
              state: expectedState
            })
          }
        }
      })

      // When page loads
      if (document.readyState !== 'loading') {
        initializePage()
      }  else {
        document.addEventListener('DOMContentLoaded', initializePage())
      }
    })
  </script>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #signInButton {
      padding: 12px 24px;
      font-size: 16px;
      background: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #signInButton:hover {
      background: #3367d6;
    }
    #loading {
      display: none;
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 8px auto;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>Signing you in...</p>
  </div>
  <button id="signInButton">Sign in with Google</button>
</body>
</html>
