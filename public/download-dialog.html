<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloading Contacts - Lawmatics Export</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 2rem;
            background: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .download-dialog {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .header h2 {
            margin: 0;
            color: #323130;
            font-size: 1.5rem;
        }
        
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }
        
        .loading-state, .success-state, .error-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        
        .spinner {
            font-size: 3rem;
            animation: spin 2s linear infinite;
        }
        
        .success-icon, .error-icon {
            font-size: 3rem;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #f3f2f1;
            border-radius: 4px;
            overflow: hidden;
            margin: 1rem 0;
        }
        
        .progress-fill {
            height: 100%;
            background-color: #0078d4;
            transition: width 0.3s ease;
        }
        
        .progress-text {
            font-size: 0.875rem;
            color: #605e5c;
        }
        
        h3 {
            margin: 0;
            color: #323130;
        }
        
        p {
            margin: 0.5rem 0;
            color: #605e5c;
        }
        
        button {
            background: #0078d4;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            margin: 0.5rem;
            font-size: 0.875rem;
        }
        
        button:hover {
            background: #106ebe;
        }
        
        button.secondary {
            background: #f3f2f1;
            color: #323130;
        }
        
        button.secondary:hover {
            background: #edebe9;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-state {
            color: #d13438;
        }
        
        .success-state {
            color: #107c10;
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="download-dialog">
        <div class="header">
            <h2>Downloading Related Contacts</h2>
        </div>
        
        <div class="content">
            <div id="error-state" class="error-state hidden">
                <div class="error-icon">❌</div>
                <h3>Export Failed</h3>
                <p id="error-message"></p>
                <button onclick="closeDialog()">Close</button>
            </div>
            
            <div id="success-state" class="success-state hidden">
                <div class="success-icon">✅</div>
                <h3>Export Complete</h3>
                <p id="success-message"></p>
                <p id="filename-display"></p>
                <button onclick="downloadFile()">Download CSV</button>
                <button class="secondary" onclick="closeDialog()">Close</button>
            </div>
            
            <div id="loading-state" class="loading-state">
                <div class="spinner">⏳</div>
                <h3>Preparing Export...</h3>
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
                </div>
                <p id="progress-message">Initializing export...</p>
                <p id="progress-text" class="progress-text">0 of 4</p>
            </div>
        </div>
    </div>

    <script>
        // Declare variables first
        let pollInterval = null;
        let filename = '';
        
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const exportId = urlParams.get('exportId');
        const token = urlParams.get('token');
        
        if (!exportId || !token) {
            showError('Missing required parameters');
        } else {
            startPolling();
        }
        
        function startPolling() {
            pollStatus();
            pollInterval = setInterval(pollStatus, 1000); // Poll every second
        }
        
        async function pollStatus() {
            try {
                const response = await fetch(`/api/lawmatics/export-status/${exportId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.progress) {
                    updateProgress(data.progress.current, data.progress.total, data.progress.message);
                }
                
                if (data.status === 'completed') {
                    if (pollInterval) {
                        clearInterval(pollInterval);
                        pollInterval = null;
                    }
                    
                    filename = data.filename || '';
                    showSuccess(data.progress?.message || 'Export completed successfully');
                    
                    // Auto-download after short delay
                    setTimeout(downloadFile, 1000);
                    
                } else if (data.status === 'error') {
                    if (pollInterval) {
                        clearInterval(pollInterval);
                        pollInterval = null;
                    }
                    showError(data.error || 'Export failed');
                }
                
            } catch (error) {
                console.error('Status polling failed:', error);
                if (pollInterval) {
                    clearInterval(pollInterval);
                    pollInterval = null;
                }
                showError('Failed to check export status');
            }
        }
        
        function updateProgress(current, total, message) {
            const percentage = total > 0 ? Math.round((current / total) * 100) : 0;
            document.getElementById('progress-fill').style.width = percentage + '%';
            document.getElementById('progress-message').textContent = message;
            document.getElementById('progress-text').textContent = `${current} of ${total}`;
        }
        
        function showError(message) {
            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('success-state').classList.add('hidden');
            document.getElementById('error-state').classList.remove('hidden');
            document.getElementById('error-message').textContent = message;
        }
        
        function showSuccess(message) {
            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('error-state').classList.add('hidden');
            document.getElementById('success-state').classList.remove('hidden');
            document.getElementById('success-message').textContent = message;
            if (filename) {
                document.getElementById('filename-display').textContent = `File: ${filename}`;
            }
        }
        
        async function downloadFile() {
            try {
                // Fetch the file with authentication headers
                const response = await fetch(`/api/download/lawmatics-csv/${exportId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                // Get the file blob and filename
                const blob = await response.blob();
                const contentDisposition = response.headers.get('content-disposition');
                let fileName = filename || 'contacts-export.csv';
                
                // Extract filename from Content-Disposition header if available
                if (contentDisposition) {
                    const matches = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/.exec(contentDisposition);
                    if (matches != null && matches[1]) {
                        fileName = matches[1].replace(/['"]/g, '');
                    }
                }
                
                // Create blob URL and trigger download
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
                // Notify parent and close dialog after short delay
                setTimeout(() => {
                    notifyParentAndClose('download-complete');
                }, 2000);
                
            } catch (error) {
                console.error('Download failed:', error);
                showError('Failed to download file');
            }
        }
        
        function closeDialog() {
            notifyParentAndClose('dialog-closed');
        }
        
        function notifyParentAndClose(message) {
            try {
                // Notify parent window (Office task pane)
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'lawmatics-export', message }, '*');
                }
                
                // Close dialog if running in Office
                if (typeof Office !== 'undefined' && Office.context?.ui) {
                    Office.context.ui.closeContainer();
                } else {
                    // Fallback for testing outside Office
                    window.close();
                }
            } catch (error) {
                console.error('Failed to notify parent or close dialog:', error);
                // Fallback
                window.close();
            }
        }
        
        // Clean up interval on page unload
        window.addEventListener('beforeunload', () => {
            if (pollInterval) {
                clearInterval(pollInterval);
            }
        });
    </script>
</body>
</html>
